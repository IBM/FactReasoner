# The FactReasoner demo (fact-reasoner-lcs-demo), live mode: RITS + in-cluster Ollama.
#
#   oc apply -f deploy/openshift/app.yaml deploy/openshift/route.yaml
#   https://factuality.vpc-int.res.ibm.com   (or port-forward, see README.md)
#
# Exactly one replica: runs live in the process's memory, so a second replica
# would not see the first one's runs (and the browser's event stream would
# break). Within the pod, DEMO_WORKERS analyses run at once, one per worker
# thread; more wait in a queue where users take turns. Needs the
# `factreasoner-keys` secret (RITS_API_KEY, SERPER_API_KEY); see README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: factreasoner-demo
  namespace: factuality
  labels: {app: factreasoner-demo}
  annotations:
    # Roll out a new image as soon as a build pushes it.
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"factreasoner-demo:latest"},
        "fieldPath":"spec.template.spec.containers[?(@.name==\"demo\")].image"}]
spec:
  replicas: 1
  strategy: {type: Recreate}   # never two at once (see above)
  selector:
    matchLabels: {app: factreasoner-demo}
  template:
    metadata:
      labels: {app: factreasoner-demo}
    spec:
      containers:
        - name: demo
          # Rewritten by the image trigger above to the internal registry digest.
          image: image-registry.openshift-image-registry.svc:5000/factuality/factreasoner-demo:latest
          ports:
            - {name: http, containerPort: 7860}
          env:
            - {name: OLLAMA_HOST, value: "http://ollama:11434"}
            # Analyses run at once (see the header). Each one's numeric work
            # (Merlin, embeddings) gets a thread of its own rather than every
            # library sizing its pool to the whole pod.
            - {name: DEMO_WORKERS, value: "4"}
            - {name: OMP_NUM_THREADS, value: "1"}
            - {name: MKL_NUM_THREADS, value: "1"}
          envFrom:
            - secretRef:
                name: factreasoner-keys
          # ephemeral-storage: the search cache and temporary files; the
          # namespace default (4Gi) is fine, but stated rather than implied.
          resources:
            requests: {cpu: "1", memory: 3Gi, ephemeral-storage: 1Gi}
            # Up to 4 analyses at once: room for one busy core each. The request
            # stays at 1 CPU, inside the namespace quota.
            limits: {cpu: "4", memory: 8Gi, ephemeral-storage: 4Gi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 36        # up to 3 min: torch + models load at import
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: factreasoner-demo
  namespace: factuality
  labels: {app: factreasoner-demo}
spec:
  selector: {app: factreasoner-demo}
  ports:
    - {name: http, port: 7860, targetPort: http}

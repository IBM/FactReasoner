[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fact_reasoner"
version = "0.6.0"
description = "Factuality Assessment for Foundation Models"
authors = [
    {name = "Radu Marinescu", email = "radu.marinescu@ie.ibm.com"},
    {name = "Javier Carnerero Cano", email = "javier.cano@ibm.com"},
    {name = "Massimiliano Pronesti", email = "massimiliano.pronesti@ibm.com"},
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "beautifulsoup4",
    "chromadb",
    "langchain-community",
    "langchain-core",
    "langchain-huggingface",
    "langchain-text-splitters",
    "mellea (==0.6.0)",
    "networkx",
    "nltk",
    "pandas (>=2.3.1)",
    "pypdf2",
    "python-dotenv",
    "requests",
    "thefuzz",
    "tqdm",
    "wikipedia",
]

[project.optional-dependencies]
# RITS backends (IBM internal). See README for the mellea-ibm install source.
rits = ["mellea-ibm"]
# Local vLLM server path (GPU node). vLLM is invoked as an external process, not
# imported, so this only needs to be installed where the server is launched.
vllm = ["vllm"]
# SIMBA-UQ NLI uncertainty estimation (fact_reasoner.uncertainty.simbauq).
# Needed to run NLIExtractor(nli_method="simbauq") — e.g. on Ollama, which does
# not expose logprobs. sentence-transformers/scikit-learn are only required for
# the "sbert" similarity metric and the classifier confidence method.
simbauq = ["numpy", "rouge-score", "scikit-learn", "sentence-transformers"]
dev = ["pytest", "ruff", "mypy", "build", "twine"]

[project.scripts]
fact-reasoner = "fact_reasoner.cli:main"

[project.urls]
Source = "https://github.com/IBM/FactReasoner"

# uv-specific: tells `uv lock`/`uv sync` where to find the IBM-internal
# `mellea-ibm` package (the `rits` extra). This metadata is ignored by the built
# wheel and by pip/PyPI consumers; it only affects uv-based resolution and
# requires git-ssh access to github.ibm.com.
[tool.uv.sources]
mellea-ibm = { git = "ssh://git@github.ibm.com/generative-computing/mellea-ibm.git" }

[tool.hatch.build.targets.wheel]
packages = ["src/fact_reasoner"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/", "data/", "lib/", "tests/"]


